<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thư 20/10 💌</title>
<style>
  :root{
    --bg1:#ffe9f0; --bg2:#ffeef7; --card:#ffd6e3;
    --text:#7a1047; --btn:#8b1a5a; --btn2:#b41f70;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Arial}
  body{
    overflow:hidden;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--text);
  }

  /* ICONS bay */
  .floaters{position:fixed;inset:0;pointer-events:none;z-index:0}
  .floater{
    position:absolute; width:34px; height:34px; opacity:.95;
    filter: drop-shadow(0 6px 10px rgba(255,122,185,.35));
    animation: drift var(--dur) linear infinite;
    left: var(--x); bottom: -40px; transform: translateX(0) translateY(0) rotate(0);
  }
  @keyframes drift{
    0%   { transform: translateY(0) translateX(0) rotate(0deg); }
    50%  { transform: translateY(-55vh) translateX(12vw) rotate(12deg); }
    100% { transform: translateY(-110vh) translateX(-8vw) rotate(-8deg); }
  }

  /* Vùng trung tâm */
  .wrap{position:relative; z-index:1; height:100%;
        display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px}

  /* Khung thư */
  .card{
    width:min(760px,86vw); height:min(360px,48vh);
    background: linear-gradient(180deg,#ffdce8, var(--card));
    border-radius:24px;
    box-shadow: 0 22px 60px rgba(167, 46, 104, .18);
    display:flex; align-items:center; justify-content:center; padding:28px;
    opacity:.0; transform: translateY(20px) scale(.98);
  }
  .card.show{ animation: cardIn .7s ease forwards; }
  @keyframes cardIn{
    to{opacity:1; transform: translateY(0) scale(1);}
  }

  /* Nội dung thư */
  .letter{
    width:100%; height:100%; overflow:hidden;
    background: #fff6fb; border-radius:18px; border:1px solid #ffd1e2;
    box-shadow: inset 0 8px 30px rgba(255, 170, 210,.25);
    display:flex; align-items:center; justify-content:center; padding:18px 22px;
  }
  .line{
    font-weight:600; line-height:1.5; text-align:center;
    font-size:clamp(18px, 3.2vw, 28px); color:#b01567;
    white-space:pre-wrap; min-height:3em;
  }
  .cursor{border-right:2px solid #b01567; animation: blink .9s steps(1,end) infinite}
  @keyframes blink{50%{border-color:transparent}}

  /* Nút mở thư */
  .openBtn{
    border:0; padding:12px 18px; border-radius:999px;
    background: linear-gradient(135deg, var(--btn), var(--btn2));
    color:white; font-weight:700; letter-spacing:.2px; cursor:pointer;
    box-shadow:0 12px 28px rgba(180,31,112,.35);
    display:flex; gap:8px; align-items:center;
  }
  .openBtn:active{transform:translateY(1px)}
  .hide{display:none}
</style>
</head>
<body>

  <!-- ICONS bay (Twemoji qua CDN) -->
  <div class="floaters" id="floaters"></div>

  <div class="wrap">
    <div class="card" id="card">
      <div class="letter">
        <div class="line" id="line"><span class="cursor"></span></div>
      </div>
    </div>

    <button class="openBtn" id="open">
      Mở thư của em 💌
      <img alt="envelope" width="18" height="18"
           src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f9f7.svg">
    </button>
  </div>

<script>
/* ====== ICONS BAY ====== */
const ICONS = [
  "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2764.svg", // ❤️
  "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f339.svg", // 🌹
  "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f33c.svg", // 🌼
  "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f337.svg", // 🌷
  "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f49c.svg"  // 💜
];
const floaters = document.getElementById('floaters');

function spawnIcon(){
  const d = document.createElement('img');
  d.className = 'floater';
  d.src = ICONS[Math.floor(Math.random()*ICONS.length)];
  d.style.setProperty('--x', Math.random()*100 + 'vw');
  d.style.setProperty('--dur', (10 + Math.random()*12) + 's');
  floaters.appendChild(d);
  setTimeout(()=> d.remove(), 14000);
}
for(let i=0;i<20;i++) setTimeout(spawnIcon, i*400);
setInterval(spawnIcon, 900);

/* ====== THƯ & LỜI CHÚC ====== */
const wishes = [
  "Chúc bạn luôn xinh đẹp, tự tin và rạng rỡ như ánh nắng ban mai! ✨",
  "Mong bạn mỗi ngày đều được yêu thương, trân trọng và thật hạnh phúc. 💖",
  "Cảm ơn bạn vì đã mang đến thế giới này sự dịu dàng và ấm áp. 🌸",
  "Chúc mọi ước mơ của bạn đều nở hoa—hôm nay và mãi về sau. 🌷",
  "Chúc mừng Ngày Phụ Nữ Việt Nam 20/10! Luôn mạnh mẽ và tỏa sáng nhé 💐"
];

const openBtn = document.getElementById('open');
const card = document.getElementById('card');
const line = document.getElementById('line');

/* Gõ chữ từng ký tự */
function typeText(text, speed=22){
  return new Promise(resolve=>{
    line.innerHTML = '<span class="cursor"></span>';
    const cursor = line.querySelector('.cursor');
    let i=0; cursor.before(document.createTextNode(""));
    const writer = setInterval(()=>{
      const t = line.childNodes[0];
      t.textContent += text[i++];
      if(i>=text.length){ clearInterval(writer); resolve(); }
    }, speed);
  });
}

async function playSequence(){
  for (let i=0; i<wishes.length; i++){
    await typeText(wishes[i]);                 // gõ xong
    await new Promise(r=> setTimeout(r, 1800)); // giữ lại 1.8s
    line.innerHTML = '<span class="cursor"></span>'; // xoá để gõ câu tiếp
  }
}

/* Mở thư */
openBtn.addEventListener('click', ()=>{
  openBtn.classList.add('hide');
  card.classList.add('show');
  setTimeout(playSequence, 400);
});
</script>
</body>
</html>
